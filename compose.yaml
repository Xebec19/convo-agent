services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myapp

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  vector-db:
    image: qdrant/qdrant
    ports:
      - 6333:6333
      - 6334:6334

  valkey:
    image: valkey/valkey
    ports:
      - 6379:6379
volumes:
  postgres_data:
